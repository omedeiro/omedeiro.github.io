name: Ingest stretching

# Bend syncs into Apple Health, and Apple Health goes no further on its own:
# HealthKit is on-device only and does not reach the Mac. A scheduled iOS
# Shortcut POSTs the last few days of Bend sessions here as a
# repository_dispatch, this job merges them into src/data/habits/stretching.json,
# and the commit triggers the usual Cloudflare deploy.
#
# The Mac's LaunchAgent can still import the same sessions off an iCloud Drive
# drop (scripts/import_shortcut_stretching.py with no arguments), but that only
# runs when the Mac is on. This is the route that updates every day.
#
# See docs/bend-stretching-shortcut.md for the phone side.

on:
  repository_dispatch:
    types: [stretching]
  workflow_dispatch:
    inputs:
      payload:
        description: "Session lines: 'start,end[,routine]' or 'YYYY-MM-DD,count', one per line"
        required: true
        type: string

permissions:
  contents: write

# Shared with the nightly refresh: both commit src/data/habits and push to main,
# and queueing them is cheaper than resolving a race afterwards.
concurrency:
  group: habits-refresh
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    env:
      # Load-bearing, not cosmetic. A session is filed under the local date it
      # started, so the runner has to agree with the phone about what "local"
      # means -- on a UTC runner a 22:30 session lands on the following day.
      TZ: America/New_York
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Via the environment, never interpolated into the script body: the
      # payload is attacker-controlled as far as this runner is concerned.
      - name: Assemble payload
        env:
          DISPATCH: ${{ toJSON(github.event.client_payload) }}
          MANUAL: ${{ inputs.payload }}
        run: |
          if [ -n "$DISPATCH" ] && [ "$DISPATCH" != "null" ]; then
            printf '%s' "$DISPATCH" > "$RUNNER_TEMP/stretching.json"
          else
            printf '%s\n' "$MANUAL" > "$RUNNER_TEMP/stretching.json"
          fi
          echo "Payload is $(wc -c < "$RUNNER_TEMP/stretching.json") bytes. First 400:"
          # Printed because the shape of what the phone sends is the one thing
          # that cannot be checked from a laptop, and a run that parses nothing
          # is otherwise indistinguishable from a run that received nothing.
          # No new exposure: the same timestamps get committed to stretching.json.
          head -c 400 "$RUNNER_TEMP/stretching.json"; echo

      # No pip install: the importers are standard-library only, so this job
      # stays fast and cannot break on a dependency release.
      # --empty-ok so a week off is a green run with no commit, while a payload
      # whose lines all failed to parse -- the shape a wrong date format takes --
      # still fails loudly. Nightly red runs for not stretching would teach us to
      # ignore exactly the signal this is here to send.
      - name: Merge sessions into stretching.json
        run: |
          python scripts/import_shortcut_stretching.py \
            --payload-file "$RUNNER_TEMP/stretching.json" --empty-ok

      - name: Commit changed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A src/data/habits

          # Every run rewrites `updated_at`, so a naive diff check would commit
          # (and redeploy the site) on every push from the phone even when it
          # re-sent a window that had not changed. Only commit a real day.
          REAL_CHANGES=$(git diff --cached -U0 -- src/data/habits \
            | grep -E '^[+-]' \
            | grep -vE '^(\+\+\+|---)' \
            | grep -v '"updated_at"' || true)

          if [ -z "$REAL_CHANGES" ]; then
            echo "Nothing new in this window; skipping commit."
            git reset
            exit 0
          fi

          git commit -m "Update stretching data"

          # The concurrency group makes a race unlikely rather than impossible
          # -- a manual dispatch can still collide with the nightly refresh.
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            echo "Push rejected (attempt $attempt); rebasing onto origin/main."
            git pull --rebase --autostash origin main || break
          done
          git push
