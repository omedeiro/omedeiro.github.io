name: Refresh habit data

# Pulls the two habits that have real web APIs and commits the result, which
# in turn triggers a Cloudflare Workers Build and deploy.
#
# Screen time and sleep are deliberately absent: both come off local Apple data
# that no runner can reach. Run scripts/fetch_screentime.py on the Mac (the
# LaunchAgent does) and commit those separately.
#
# Stretching is not fetched here either, but it does reach CI -- the phone pushes
# it, so it arrives on its own schedule in stretching.yml rather than on this
# cron. The last step here only notices when it stops arriving.

on:
  schedule:
    - cron: "0 6 * * *" # 02:00 America/New_York (03:00 during standard time)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: habits-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # No pip install: the fetch scripts deliberately use only the standard
      # library so this job stays fast and can't break on a dependency release.

      - name: Check which credentials are configured
        id: creds
        env:
          STRAVA_REFRESH_TOKEN: ${{ secrets.STRAVA_REFRESH_TOKEN }}
          GH_CONTRIB_TOKEN: ${{ secrets.GH_CONTRIB_TOKEN }}
        run: |
          # Warn and skip rather than fail, so the schedule stays green until
          # the secrets are added instead of mailing a failure every night.
          if [ -n "$STRAVA_REFRESH_TOKEN" ]; then
            echo "strava=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::STRAVA_REFRESH_TOKEN is not set — skipping the running refresh. See the Habits section of AGENTS.md."
            echo "strava=false" >> "$GITHUB_OUTPUT"
          fi
          if [ -n "$GH_CONTRIB_TOKEN" ]; then
            echo "github=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::GH_CONTRIB_TOKEN is not set — skipping the commits refresh. See the Habits section of AGENTS.md."
            echo "github=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch Strava activities
        id: strava
        if: steps.creds.outputs.strava == 'true'
        continue-on-error: true
        env:
          STRAVA_CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID }}
          STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
          STRAVA_REFRESH_TOKEN: ${{ secrets.STRAVA_REFRESH_TOKEN }}
          STRAVA_TOKEN_SINK: ${{ runner.temp }}/strava-refresh-token
        run: python scripts/fetch_strava.py

      - name: Persist rotated Strava refresh token
        if: steps.creds.outputs.strava == 'true' && steps.strava.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GH_ADMIN_TOKEN }}
          SINK: ${{ runner.temp }}/strava-refresh-token
        run: |
          # Strava may hand back a new refresh token; without writing it back
          # to the secret store, tomorrow's run fails with an invalid grant.
          if [ ! -s "$SINK" ]; then
            echo "Refresh token unchanged."
            exit 0
          fi
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::Strava rotated its refresh token, but GH_ADMIN_TOKEN is not configured. Update the STRAVA_REFRESH_TOKEN secret by hand or the next run will fail."
            exit 0
          fi
          gh secret set STRAVA_REFRESH_TOKEN --body "$(cat "$SINK")"
          rm -f "$SINK"
          echo "Rotated refresh token stored."

      - name: Fetch GitHub contributions
        id: github
        if: steps.creds.outputs.github == 'true'
        continue-on-error: true
        env:
          GH_CONTRIB_TOKEN: ${{ secrets.GH_CONTRIB_TOKEN }}
        run: python scripts/fetch_github.py

      - name: Commit changed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A src/data/habits

          # Every run rewrites `updated_at`, so a naive diff check would commit
          # (and redeploy the site) nightly even when nothing happened. Only
          # commit when an actual day changed.
          REAL_CHANGES=$(git diff --cached -U0 -- src/data/habits \
            | grep -E '^[+-]' \
            | grep -vE '^(\+\+\+|---)' \
            | grep -v '"updated_at"' || true)

          if [ -z "$REAL_CHANGES" ]; then
            echo "No new activity; skipping commit."
            git reset
            exit 0
          fi

          git commit -m "Refresh habit data"
          git push

      # The habits pushed from the phone and the Mac have no schedule this job
      # can check up on -- if the Shortcut is deleted or the LaunchAgent stops,
      # nothing fails, the column simply stops growing. Annotate rather than
      # fail: a stale column is worth noticing, not worth mailing a red run for
      # every night until it is fixed.
      - name: Warn on stale locally-pushed habits
        if: always()
        run: |
          python - <<'PY'
          import datetime as dt, json, pathlib

          STALE_AFTER_DAYS = 4
          today = dt.date.today()
          for habit, how in (("stretching", "the Bend Shortcut"),
                             ("screentime", "the Mac LaunchAgent")):
              path = pathlib.Path("src/data/habits") / f"{habit}.json"
              days = json.loads(path.read_text()).get("days") or {}
              if not days:
                  print(f"::warning::{habit}.json holds no days at all.")
                  continue
              newest = max(days)
              age = (today - dt.date.fromisoformat(newest)).days
              if age > STALE_AFTER_DAYS:
                  print(f"::warning::{habit}.json has not moved since {newest} "
                        f"({age} days). Check {how}.")
              else:
                  print(f"{habit}: newest day {newest} ({age}d old), fine.")
          PY

      # Runs last so a partial failure still commits what did work, but the run
      # is still reported red rather than passing silently.
      - name: Report source failures
        if: steps.strava.outcome == 'failure' || steps.github.outcome == 'failure'
        run: |
          [ "${{ steps.strava.outcome }}" = "failure" ] && echo "::error::Strava refresh failed — see the 'Fetch Strava activities' step."
          [ "${{ steps.github.outcome }}" = "failure" ] && echo "::error::GitHub refresh failed — see the 'Fetch GitHub contributions' step."
          exit 1
